name: Deploy to Production

on:
  push:
    branches: [synos-ngvps]
  workflow_dispatch:

concurrency:
  group: deploy-synos-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: [self-hosted, synos]
    timeout-minutes: 20
    steps:
      - name: Pull latest code
        run: |
          cd /home/ubuntu/synos
          git fetch origin synos-ngvps
          git reset --hard origin/synos-ngvps
          git log -1 --oneline

      - name: Install dependencies
        run: |
          cd /home/ubuntu/synos
          npm install --legacy-peer-deps

      - name: Build
        run: |
          cd /home/ubuntu/synos
          npm run build
          cp -r .next/static .next/standalone/.next/static
          [ -d public ] && cp -r public .next/standalone/public || true

      - name: Restart PM2 process
        run: |
          cd /home/ubuntu/synos
          pm2 stop synos || true
          pm2 delete synos || true
          pm2 start /home/ubuntu/synos/start.sh --name synos
          pm2 save

      - name: Health check
        run: |
          sleep 5
          curl -fsS -o /dev/null -w "HTTP %{http_code}\n" http://127.0.0.1:3001 || (pm2 logs synos --lines 40 --nostream; exit 1)
